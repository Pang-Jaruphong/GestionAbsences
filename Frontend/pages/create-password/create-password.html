<!doctype html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../../login2.css" />
    <title>Créer un mot de passe</title>
</head>
<body>
<div class="login">
    <div class="imgfond">
        <img src="../../Img/login_fond.png" alt="Background Image" />
    </div>
    <div class="img"><img src="../../Img/login_fond.png" alt="Login Image" /></div>
    <div class="boxForm">
        <form id="createPwForm" class="createPwForm">
            <img src="../../Img/logo%20seul%20vert.png" alt="" class="logoVert" />
            <h2>Créez votre mot de passe</h2>
            <input
                    type="password"
                    id="newPassword"
                    placeholder="Nouveau mot de passe"
                    required
            />
            <button type="submit">Confirmer</button>
        </form>
    </div>
</div>

<script>
    document
        .getElementById("createPwForm")
        .addEventListener("submit", async (e) => {
            e.preventDefault();
            const email = localStorage.getItem("firstLoginEmail");
            const newPassword = document.getElementById("newPassword").value;

            const response = await fetch("http://localhost:4000/auth/createPW", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email, newPassword }),
            });

            if (response.ok) {
                alert("Mot de passe créé ! Connectez-vous maintenant.");
                localStorage.removeItem("firstLoginEmail");
                window.location.href = "login.html"; // Retour au login
            }
        });
</script>
</body>
</html>
