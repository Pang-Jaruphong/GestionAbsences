<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../../login2.css" />
    <title>Create Your Password</title>
</head>
<body>
<div class="login">
    <div class="imgfond">
        <img src="../../Img/login_fond.png" alt="Background Image" />
    </div>
    <div class="boxForm">
        <form id="createPwForm" class="createPwForm">
            <img src="../../Img/logo%20seul%20vert.png" alt="Logo" class="logoVert" />
            <h2>Create Your Password</h2>
            
            <p id="infoMessage" style="font-size: 0.9em; color: #666;">
                Please enter a secure password to activate your account.
            </p>

            <input 
                type="password" 
                id="newPassword" 
                placeholder="New Password" 
                required 
            />
            
            <input 
                type="password" 
                id="confirmPassword" 
                placeholder="Confirm Password" 
                required 
            />

            <button type="submit">Confirm & Activate</button>
            <p id="errorMessage" style="color: #d9534f; margin-top: 10px; font-weight: bold;"></p>
        </form>
    </div>
</div>

<script>
    document.getElementById("createPwForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        
        const newPassword = document.getElementById("newPassword").value;
        const confirmPassword = document.getElementById("confirmPassword").value;
        const errorDisplay = document.getElementById("errorMessage");

        // 1. Basic validation: Check if passwords match
        if (newPassword !== confirmPassword) {
            errorDisplay.innerText = "Passwords do not match.";
            return;
        }

        // 2. Extract the token from the URL (?token=...)
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (!token) {
            errorDisplay.innerText = "Invalid link. Please use the link provided in your email.";
            return;
        }

        try {
            // 3. Send the token and password to the Backend
            const response = await fetch("http://localhost:4000/auth/verify-and-setup", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ token, newPassword }),
            });

            const data = await response.json();

            if (response.ok) {
                alert("Success! Your account is now active. Please log in.");
                window.location.href = "../login/login.html"; // Redirect to login
            } else {
                // This handles the 20-minute expiration or invalid token
                errorDisplay.innerText = data.message;
            }
        } catch (error) {
            errorDisplay.innerText = "Server connection error. Please try again later.";
        }
    });
</script>
</body>
</html>
