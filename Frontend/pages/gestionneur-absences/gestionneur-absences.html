<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gestionneur d'absences</title>
    <link rel="stylesheet" href="gestionneur-absences.css" />
</head>
<body>
    <section class="gestionneur-absences">
        <div class="headers">
            <p class="header">Nom</p>
            <p class="header">Prénom</p>
            <p class="header">Type</p>
            <p class="header">Nb. périodes</p>
            <p class="header">Justification</p>
            <p class="header">Justifié</p>
        </div>

        <div class="absences">
            <div class="absence">
                <span>Dupont</span>
                <span>Jean</span>
                <span>Absence</span>
                <span>4</span>
                <span>Maladie</span>
                <span>Oui</span>
            </div>
            <div class="absence">
                <span>Muller</span>
                <span>Anna</span>
                <span>Retard</span>
                <span>1</span>
                <span>Train en retard</span>
                <span>Non</span>
            </div>
        </div>
    </section>
</body>
</html>
