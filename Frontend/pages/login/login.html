<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="login.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Attendance Management - Login</title>
</head>
<body>
    <img class="imgfond" src="../../Img/login_fond.png" alt="Background" />
    <section class="login">
      <div class="boxForm">
        <img class="logoVert" src="../../Img/logo%20seul%20vert.png" alt="Logo" />
        <form class="formLogin" id="loginForm">
          <h1>Login</h1>
          <div class="mb-3">
            <label class="form-label">Email address</label>
            <input type="email" class="form-control" id="emailInput" required />
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" id="passwordInput" />
          </div>
          <button type="submit" class="container-fluid btn btn-primary">Login</button>
        </form>
      </div>
    </section>
    <script src="../../script.js"></script>
</body>
</html>
